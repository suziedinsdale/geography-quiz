<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AS Physical Geography Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one narrow column, phone first. Home is a menu of three ways in; the quiz shows one question per screen.
   Each case study keeps the marker colour of its poster title, laid down like a highlighter stroke. */
:root{
  --paper:#F4F6FA; --card:#FFFFFF; --ink:#141824; --ink-2:#565D70; --line:#D9DDE7;
  --hl:#FFE95E;
  --good:#17703C; --good-bg:#D3F4D7; --bad:#B3243D; --bad-bg:#FFDCE2;
  --hyd:#1D6BC0; --atm:#7A3DA8; --rok:#A8501E;
  --display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --t:var(--ink);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12141B; --card:#1C1F2A; --ink:#EEF0F6; --ink-2:#A3A9BB; --line:#313545;
    --hl:#7A6C00;
    --good:#6FDB98; --good-bg:#173A26; --bad:#FF8A9B; --bad-bg:#47202A;
    --hyd:#6DB2FF; --atm:#C797F2; --rok:#E9A06C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12141B; --card:#1C1F2A; --ink:#EEF0F6; --ink-2:#A3A9BB; --line:#313545;
  --hl:#7A6C00;
  --good:#6FDB98; --good-bg:#173A26; --bad:#FF8A9B; --bad-bg:#47202A;
  --hyd:#6DB2FF; --atm:#C797F2; --rok:#E9A06C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:20px 40px}
#app{max-width:620px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;text-wrap:balance}
.mark{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 92%,transparent 92%);padding-inline:.12em}
.sub{color:var(--ink-2)}
.block{display:flex;flex-direction:column;gap:10px}
.block > .sub{font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ken);outline-offset:2px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;padding:14px 18px;border-radius:12px;text-align:center;width:100%}
.btn.ghost{background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 180px}
.link{background:none;border:0;padding:6px 0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.resume{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}

.topics{display:flex;flex-direction:column;gap:8px}
.topic{display:grid;grid-template-columns:26px 1fr auto;column-gap:12px;row-gap:8px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.topic[aria-pressed="true"]{border-color:var(--t)}
.swatch{width:26px;height:26px;border-radius:7px;border:2px solid var(--t);display:grid;place-items:center;color:var(--card);font-weight:700;font-size:16px;line-height:1}
.topic[aria-pressed="true"] .swatch{background:var(--t)}
.tname{font-weight:700;min-width:0}
.tmeta{display:block;font-weight:400;font-size:.85rem;color:var(--ink-2)}
.tpct{font-variant-numeric:tabular-nums;font-weight:700;color:var(--t)}
.meter{grid-column:1 / -1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.meter > span{display:block;height:100%;background:var(--t);border-radius:4px}

.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:10px}
.ghead h3{font-family:var(--display);font-weight:600;font-size:1rem;background:color-mix(in srgb,var(--t) 24%,transparent);padding:2px 8px;border-radius:3px}
.ghead .link{font-size:.9rem;white-space:nowrap}
.foot{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px;font-size:.95rem}
.switch{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;text-align:left}
.switch i{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--card)}
.switch[aria-pressed="true"] i{background:var(--ink)}
.switch[aria-pressed="true"] i::after{left:19px}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.count{font-variant-numeric:tabular-nums;font-weight:700}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track > div{height:100%;background:var(--ink)}
.qcard{display:flex;flex-direction:column;gap:16px}
.tag{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.tag .hl{background:color-mix(in srgb,var(--t) 24%,transparent);padding:3px 8px;border-radius:3px}
.tag .sec{color:var(--ink-2)}
.q{font-family:var(--display);font-weight:600;font-size:1.5rem;line-height:1.2;text-wrap:balance}
.opts,.points{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;width:100%}
.opt b{width:28px;height:28px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--ink-2)}
.opt span{min-width:0}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right b{border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong b{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.opt.sel{border-color:var(--ink)}
.opt.sel b{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt.miss{border-style:dashed;border-color:var(--good)}
.opt.miss b{border-color:var(--good);color:var(--good)}
.tagm{display:block;font-style:normal;font-size:.8rem;font-weight:700;margin-top:2px}
.opt.miss .tagm{color:var(--good)}
.opt.wrong .tagm{color:var(--bad)}
.opt[disabled]{cursor:default}
.opt.on{background:var(--good-bg);border-color:var(--good)}
.opt.on b{background:var(--good);border-color:var(--good);color:var(--card)}
.verdict{font-weight:700}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--bad)}
.note{background:var(--card);border-left:5px solid var(--hl);padding:10px 12px;font-size:.95rem}
.answer{background:var(--card);border:2px solid var(--t);border-radius:12px;padding:14px;font-weight:700}
.hint{color:var(--ink-2);font-size:.95rem}

.score{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.split{display:flex;flex-direction:column;gap:6px;list-style:none;padding:0;margin:0}
.split li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-block:6px}
.split b{font-variant-numeric:tabular-nums;color:var(--t)}
.missed{display:flex;flex-direction:column;gap:10px;list-style:none;padding:0;margin:0}
.missed li{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--t);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.missed .mq{font-weight:700}
.missed .ma{color:var(--ink-2);font-size:.95rem}
@media (prefers-reduced-motion:no-preference){
  .track > div,.meter > span{transition:width .25s ease}
}
</style>
</head>
<body>
<main id="app"></main>

<script>
(function(){
"use strict";

var GROUPS=[
  {id:"hyd",name:"1 Hydrology and fluvial geomorphology"},
  {id:"atm",name:"2 Atmosphere and weather"},
  {id:"rok",name:"3 Rocks and weathering"}
];
var TOPICS=[
  {id:"h1",g:"hyd",name:"1.1 The drainage basin system"},
  {id:"h2",g:"hyd",name:"1.2 Discharge relationships"},
  {id:"h3",g:"hyd",name:"1.3 River channel processes and landforms"},
  {id:"h4",g:"hyd",name:"1.4 The human impact"},
  {id:"ken",g:"hyd",name:"Case study: Kendal floods"},
  {id:"tee",g:"hyd",name:"Case study: River Tees management"},
  {id:"a1",g:"atm",name:"2.1 Diurnal energy budgets"},
  {id:"a2",g:"atm",name:"2.2 The global energy budget"},
  {id:"a3",g:"atm",name:"2.3 Weather processes and phenomena"},
  {id:"a4",g:"atm",name:"2.4 The human impact"},
  {id:"r1",g:"rok",name:"3.1 Plate tectonics"},
  {id:"r2",g:"rok",name:"3.2 Weathering"},
  {id:"r3",g:"rok",name:"3.3 Slope processes"},
  {id:"r4",g:"rok",name:"3.4 The human impact"},
  {id:"abe",g:"rok",name:"Case study: Aberfan"}
];

function m(id,sec,q,a,d,note){return {id:id,t:id.split("-")[0],sec:sec,type:"mc",q:q,a:a,d:d,note:note||""};}
function r(id,sec,q,p,note){return {id:id,t:id.split("-")[0],sec:sec,type:"rc",q:q,p:p,note:note||""};}
var EDGE="Rebuilt from a part-hidden poster. Check the wording against the one on the wall.";

var Q=[
/* 1.1 The drainage basin system */
m("h1-01","System","What is a drainage basin?","The area of land drained by a river and its tributaries",["The channel that a river flows in","The land that floods when a river overflows","The point where a river meets the sea"]),
m("h1-02","System","What is a watershed?","The boundary that divides one drainage basin from another",["The point where two rivers join","The place where a river starts","The lowest point of a drainage basin"]),
m("h1-03","System","Why is a drainage basin described as an open system?","Water and energy enter and leave across its boundary",["Water only moves between stores inside it","It has no stores, only flows","It is not enclosed by high ground"]),
r("h1-04","System","What is the main input to the drainage basin system?",["Precipitation"]),
r("h1-05","Outputs","Name the three outputs of the drainage basin system.",["Evaporation","Evapotranspiration","River discharge"]),
m("h1-06","Outputs","What is evaporation?","Liquid water changing to water vapour from a surface",["Water vapour changing to liquid water","Water lost from plant leaves","Water soaking into the soil"]),
m("h1-07","Outputs","What is transpiration?","Water vapour lost from plants through the stomata in their leaves",["Water dripping from leaves to the ground","Water taken up by plant roots","Water evaporating from the soil surface"]),
m("h1-08","Outputs","What is evapotranspiration?","The combined loss of water by evaporation and transpiration",["Evaporation from the sea only","Transpiration from trees only","Water lost as river discharge"]),
r("h1-09","Outputs","What is the difference between potential and actual evapotranspiration?",["Potential: the amount that would happen if water supply were unlimited","Actual: the amount that does happen with the water available"]),
m("h1-10","Outputs","What is river discharge?","The volume of water passing a point in a river in a given time",["The speed of the water in a river","The amount of sediment a river carries","The depth of water in a river"]),
r("h1-11","Stores","Name the five stores in a drainage basin.",["Interception","Soil water","Surface water","Groundwater","Channel storage"]),
m("h1-12","Stores","What is interception?","Precipitation caught and held by vegetation before it reaches the ground",["Water soaking into the soil","Water held in lakes and puddles","Water flowing over the ground surface"]),
r("h1-13","Stores","What affects how much water is intercepted?",["Vegetation type and density (forest intercepts more than grass)","Season (deciduous trees intercept less in winter)","Rainfall intensity and duration (the store fills in long or heavy rain)"]),
r("h1-14","Stores","What is surface water storage? Give examples.",["Water held on the ground surface","For example puddles, ponds and lakes"]),
m("h1-15","Stores","What is soil water?","Water held in the pore spaces of the soil",["Water flowing over the soil surface","Water stored in saturated rock","Water held on leaves"]),
m("h1-16","Stores","What is channel storage?","Water held in the river channel itself",["Water held in rock below the water table","Water held in the soil","Water held behind a dam only"]),
r("h1-17","Flows","Name the four above-ground flows.",["Throughfall","Stemflow","Overland flow","Channel flow"]),
r("h1-18","Flows","Name the five below-ground flows.",["Infiltration","Percolation","Throughflow","Groundwater flow","Baseflow"]),
m("h1-19","Flows","What is throughfall?","Water dripping from leaves and branches to the ground",["Water running down stems and trunks","Water moving sideways through the soil","Water soaking into the soil"]),
m("h1-20","Flows","What is stemflow?","Water running down stems and trunks to the ground",["Water dripping from leaves to the ground","Water moving up through a plant","Water flowing in a small stream"]),
m("h1-21","Flows","What is overland flow?","Water flowing over the ground surface",["Water moving sideways through the soil","Water flowing in the river channel","Water moving through rock"]),
r("h1-22","Flows","Give the two situations in which overland flow happens.",["Rain falls faster than the soil can absorb it (infiltration capacity is exceeded)","The soil is already saturated, so no more water can infiltrate"]),
m("h1-23","Flows","What is infiltration?","Water soaking from the surface into the soil",["Water moving from soil into rock","Water moving sideways through the soil","Water flowing over the surface"]),
m("h1-24","Flows","What is infiltration capacity?","The maximum rate at which a soil can absorb water",["The total amount of water a soil can hold","The depth of the water table","The rate at which water moves through rock"]),
m("h1-25","Flows","What is percolation?","Water moving downwards from the soil into the rock below",["Water soaking from the surface into the soil","Water moving sideways through the soil","Water flowing out at a spring"]),
m("h1-26","Flows","What is throughflow?","Water moving sideways, downslope, through the soil",["Water dripping through the leaf canopy","Water moving through saturated rock","Water flowing over the surface"]),
m("h1-27","Flows","What is groundwater flow?","The slow movement of water through saturated rock",["Fast flow of water over saturated ground","Water moving sideways through the soil","Water soaking into the soil"]),
m("h1-28","Flows","What is baseflow?","The part of a river's discharge supplied by groundwater",["The discharge at the peak of a flood","Water reaching the river as overland flow","Water flowing along the river bed only"]),
m("h1-29","Flows","Which flow usually reaches the river fastest?","Overland flow",["Throughflow","Groundwater flow","Percolation"]),
m("h1-30","Flows","Which flow is the slowest route to the river?","Groundwater flow",["Overland flow","Throughflow","Stemflow"]),
m("h1-40","Flows","What is channel flow?","Water flowing in the river channel",["Water flowing over the ground surface","Water moving sideways through the soil","Water held in lakes and ponds"]),
m("h1-31","Flows","Percolation is which kind of component?","A below-ground flow",["An above-ground flow","A store","An output"]),
m("h1-32","Stores","Interception is which kind of component?","A store",["A below-ground flow","An above-ground flow","An output"]),
m("h1-33","Underground water","What is the water table?","The upper surface of the saturated zone",["The bottom of the soil layer","The level of water in a river","The base of an aquifer"]),
m("h1-34","Underground water","What is groundwater?","Water stored in the pores and cracks of saturated rock below the water table",["Water held in the soil above the water table","Water lying on the ground surface","Water in the river channel"]),
m("h1-35","Underground water","What is recharge?","The refilling of groundwater by water percolating down",["Water leaving an aquifer at a spring","Water pumped out of an aquifer","Water evaporating from the soil"]),
m("h1-36","Underground water","What is an aquifer?","A permeable rock that stores and transmits groundwater",["An impermeable rock that blocks water","A lake fed by a spring","A river channel cut into rock"]),
r("h1-37","Underground water","What is a spring, and where does one form?",["A place where groundwater flows out at the surface","Where the water table meets the surface, often where permeable rock lies over impermeable rock"]),
r("h1-38","Underground water","Name the two zones either side of the water table.",["Phreatic zone: permanently saturated rock below the water table","Vadose (aeration) zone: unsaturated rock and soil above it"]),
r("h1-39","Underground water","How does the water table change through the year?",["It rises in wet periods, when recharge is greater than losses","It falls in dry periods"]),

/* 1.2 Discharge relationships within drainage basins */
m("h2-01","Hydrographs","What does a storm hydrograph show?","How a river's discharge responds to a single rainfall event",["How discharge varies over a whole year","How fast a river flows at different depths","How much sediment a river carries"]),
m("h2-02","Hydrographs","What does an annual hydrograph (river regime) show?","How a river's discharge varies over a year",["How discharge responds to one storm","The highest flood in each year","Rainfall for each month"]),
m("h2-03","Hydrographs","In what unit is discharge measured?","Cumecs (cubic metres per second)",["Metres per second","Cubic metres","Millimetres per hour"]),
m("h2-04","Hydrographs","How is discharge calculated?","Cross-sectional area multiplied by velocity",["Width multiplied by depth","Velocity divided by cross-sectional area","Wetted perimeter multiplied by depth"]),
r("h2-05","Hydrographs","Name the components of a storm hydrograph.",["Rising limb","Peak discharge","Lag time","Falling (recessional) limb","Baseflow","Storm flow (quickflow)"]),
m("h2-06","Hydrographs","What is lag time?","The time between peak rainfall and peak discharge",["The time between the start of rain and the start of flooding","The time the river stays above bankfull","The time between two storms"]),
m("h2-07","Hydrographs","What is the rising limb?","The part of the graph where discharge increases after the rain begins",["The part where discharge falls back to normal","The bars showing rainfall","The line showing baseflow"]),
m("h2-08","Hydrographs","What is the falling (recessional) limb?","The part of the graph where discharge falls after the peak",["The part where discharge rises to the peak","The fall in rainfall after a storm","The drop in the water table"]),
m("h2-09","Hydrographs","What is peak discharge?","The highest discharge reached after the rainfall event",["The discharge before the rain started","The highest rainfall in one hour","The discharge when the river first floods"]),
m("h2-10","Hydrographs","What is storm flow (quickflow)?","Discharge above baseflow, supplied by overland flow and throughflow",["Discharge supplied by groundwater","Discharge at bankfull","Rain falling directly into the channel only"]),
m("h2-11","Hydrographs","What is bankfull discharge?","The discharge at which the channel is completely full, so any more causes flooding",["The lowest discharge of the year","The average discharge of the river","The discharge supplied by groundwater"]),
r("h2-12","Hydrographs","Describe a flashy hydrograph.",["Short lag time","Steep rising and falling limbs","High peak discharge"]),
r("h2-13","Hydrographs","What controls the shape of a river's annual regime?",["The seasonal pattern of precipitation","Temperature, through evapotranspiration and snow or ice melt","Basin characteristics such as geology and land use"]),
r("h2-33","Hydrographs","What is the difference between a simple and a complex river regime?",["Simple: one period of high discharge and one of low discharge each year","Complex: several peaks, because the river crosses different climate or relief regions or has many tributaries"]),
r("h2-14","Climate","Name the six climate influences on hydrographs listed in the syllabus.",["Precipitation type and intensity","Temperature","Evaporation","Transpiration","Evapotranspiration","Antecedent moisture"]),
r("h2-15","Climate","How does precipitation intensity affect a hydrograph?",["Intense rain can exceed the infiltration capacity of the soil","This causes overland flow, so a short lag time and high peak"]),
r("h2-16","Climate","How does precipitation type affect a hydrograph?",["Snow is stored on the surface, so lag time is long","Rapid snowmelt later releases the water and can give a high peak"]),
r("h2-17","Climate","How does temperature affect a hydrograph?",["High temperatures increase evapotranspiration, so less water reaches the river","Frozen ground is impermeable, so overland flow increases","Rising temperatures can cause snowmelt, which increases discharge"]),
r("h2-18","Climate","How do evaporation and transpiration affect discharge?",["They return water to the atmosphere","So less water reaches the river and peak discharge is lower"]),
m("h2-19","Climate","What is antecedent moisture?","The amount of water already in the soil before the rain starts",["The rain that falls in the first hour of a storm","Water left in the channel after a flood","Moisture in the air before a storm"]),
r("h2-20","Climate","How does high antecedent moisture affect a hydrograph?",["The soil is already saturated, so infiltration is low and overland flow is high","Short lag time and high peak discharge"]),
r("h2-21","Basin","Name the drainage basin characteristics that influence hydrographs.",["Size and shape","Drainage density","Porosity and permeability of soils","Rock type","Slopes","Vegetation type","Land use"]),
r("h2-22","Basin","How does basin size affect a hydrograph?",["Small basin: water reaches the river quickly, so a short lag time","Large basin: longer lag time, but a higher peak discharge because more water is collected"]),
r("h2-23","Basin","How does basin shape affect a hydrograph?",["Circular basin: water from all parts arrives at about the same time, so a short lag and high peak","Elongated basin: water arrives over a longer period, so a longer lag and lower peak"]),
m("h2-24","Basin","What is drainage density?","The total length of streams divided by the area of the basin",["The number of streams in a basin","The area of the basin divided by its length","The volume of water per square kilometre"]),
r("h2-25","Basin","How does drainage density affect a hydrograph?",["High density: water reaches a channel quickly, so a short lag and high peak","Low density: water travels further as slower throughflow, so a longer lag and lower peak"]),
m("h2-26","Basin","What is porosity?","The proportion of a rock or soil made up of pore spaces",["The ability of a rock to let water pass through","The number of joints in a rock","The hardness of a rock"]),
m("h2-27","Basin","What is permeability?","The ability of a rock or soil to let water pass through it",["The amount of pore space in a rock","The amount of water a rock holds","The resistance of a rock to erosion"]),
r("h2-28","Basin","How do soil porosity and permeability affect a hydrograph?",["Sandy soils have large pores, so high infiltration, less overland flow and a lower peak","Clay soils have tiny pores, so low infiltration, more overland flow and a flashier response"]),
r("h2-29","Basin","How does rock type affect a hydrograph?",["Permeable rock (chalk, limestone) lets water percolate: long lag, low peak, high baseflow","Impermeable rock (granite, clay) gives more surface runoff: short lag, high peak"]),
r("h2-30","Basin","How do slopes affect a hydrograph?",["Steep slopes: water runs off quickly with little infiltration, so a short lag and high peak","Gentle slopes: more time to infiltrate, so a longer lag and lower peak"]),
r("h2-31","Basin","How does vegetation affect a hydrograph?",["Forest intercepts rain and takes up water, so a longer lag and lower peak","Bare ground or sparse vegetation gives more overland flow","Deciduous trees intercept less in winter"]),
r("h2-32","Basin","How does urban land use affect a hydrograph?",["Impermeable surfaces such as tarmac and concrete stop infiltration","Drains and sewers carry water quickly to the river","So a short lag time and high peak discharge"]),
r("h2-34","Basin","How does agricultural land use affect a hydrograph?",["Bare, ploughed or compacted soil gives more overland flow, especially when ploughed up and down the slope","Field drains carry water quickly to the river, so lag time is shorter","Crops intercept rain, but less than forest"]),

/* 1.3 River channel processes and landforms */
r("h3-01","Erosion","Name the four erosion processes in the syllabus.",["Abrasion (corrasion)","Solution","Cavitation","Hydraulic action"]),
m("h3-02","Erosion","What is abrasion (corrasion)?","The load the river carries wears away the bed and banks",["The force of water alone breaks up the banks","Rock is dissolved by the water","Air bubbles collapse against the bank"]),
m("h3-03","Erosion","What is hydraulic action?","The sheer force of moving water dislodges material and compresses air in cracks",["The river's load scrapes the bed","Rock dissolves in slightly acidic water","Particles of load hit each other and get smaller"]),

function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}

function known(list){var s=0;list.forEach(function(q){if(stats[q.id])s+=stats[q.id].s;});return list.length?Math.round(100*s/list.length):0;}
function answered(list){return list.filter(function(q){return stats[q.id];}).length;}
function weakest(){
  var a=Q.filter(function(q){return stats[q.id];});
  a.sort(function(x,y){var sx=stats[x.id],sy=stats[y.id];return (sx.s-sy.s)||(sx.t-sy.t);});
  return a.slice(0,WEAK_SIZE).map(function(q){return q.id;});
}
function order(ids){return prefs.shuffle?shuffle(ids):ids;}

function start(label,ids){
  if(!ids.length)return;
  sess={label:label,ids:ids,i:0,res:{}};save("pq.session",sess);nextQ();
}
function nextQ(){
  if(!sess){view="home";render();return;}
  if(sess.i>=sess.ids.length){finish();return;}
  var q=byId[sess.ids[sess.i]];
  cur={q:q,pos:sess.i,done:false,
       opts:q.type==="mc"?shuffle([q.a].concat(q.d)):(q.type==="ms"?shuffle(q.p.concat(q.x)):null),picked:null,
       sel:q.type==="ms"?q.p.concat(q.x).map(function(){return false;}):null,
       shown:false,ticks:q.type==="rc"?q.p.map(function(){return false;}):null};
  view="quiz";render();window.scrollTo(0,0);
}
function record(score){
  var id=cur.q.id,st=stats[id]||{n:0,s:0};
  st.s=st.n?(st.s+score)/2:score;st.n+=1;st.t=Date.now();
  stats[id]=st;save("pq.stats",stats);
  sess.res[id]=score;sess.i=cur.pos+1;save("pq.session",sess);cur.done=true;
}
function finish(){last=sess;sess=null;drop("pq.session");view="done";render();window.scrollTo(0,0);}

function renderHome(){
  var total=Q.length,ans=answered(Q),weakN=Math.min(WEAK_SIZE,ans);
  var selIds=Q.filter(function(q){return prefs.sel.indexOf(q.t)>-1;}).map(function(q){return q.id;});
  var h='<header class="block"><h1><span class="mark">Physical geography quiz</span></h1>'+
    '<p class="sub">'+total+' questions on Cambridge AS Level Geography (9696) Paper 1. '+ans+' answered so far, '+known(Q)+'% known.</p></header>';
  if(sess){
    h+='<section class="resume"><h2>'+esc(sess.label)+', in progress</h2>'+
      '<p class="sub">You’re on question '+(sess.i+1)+' of '+sess.ids.length+'.</p>'+
      '<button class="btn" data-act="resume">Carry on</button></section>';
  }
  h+='<section class="block"><h2>Everything</h2>'+
    '<p class="sub">The whole Paper 1 syllabus, plus the Kendal, River Tees and Aberfan case studies. Stop whenever you like and it keeps your place.</p>'+
    '<button class="btn'+(sess?' ghost':'')+'" data-act="all">Start all '+total+' questions</button></section>';
  h+='<section class="block"><h2>By topic</h2><p class="sub">Tick one or more. The bar shows how much of each you know.</p><div class="topics">';
  GROUPS.forEach(function(g){
    var mine=TOPICS.filter(function(t){return t.g===g.id;});
    var allOn=mine.every(function(t){return prefs.sel.indexOf(t.id)>-1;});
    h+='<div class="ghead" style="--t:var(--'+g.id+')"><h3>'+esc(g.name)+'</h3><button class="link" data-act="group" data-id="'+g.id+'">'+(allOn?'Clear':'Select all')+'</button></div>';
    mine.forEach(function(t){
    var list=Q.filter(function(q){return q.t===t.id;}),on=prefs.sel.indexOf(t.id)>-1,k=known(list);
    h+='<button class="topic" data-act="topic" data-id="'+t.id+'" aria-pressed="'+on+'" style="--t:var(--'+t.g+')">'+
      '<span class="swatch" aria-hidden="true">'+(on?'✓':'')+'</span>'+
      '<span class="tname">'+esc(t.name)+'<span class="tmeta">'+list.length+' questions, '+answered(list)+' answered</span></span>'+
      '<span class="tpct">'+k+'%</span>'+
      '<span class="meter"><span style="width:'+k+'%"></span></span></button>';
    });
  });
  h+='</div><button class="btn ghost" data-act="topics"'+(selIds.length?'':' disabled')+'>'+
    (selIds.length?'Start '+selIds.length+' questions':'Pick a topic')+'</button></section>';
  h+='<section class="block"><h2>Least well known</h2>';
  if(ans>=WEAK_MIN){
    h+='<p class="sub">Your '+weakN+' lowest scoring questions, worked out from your answers. It updates every time you answer.</p>'+
      '<button class="btn ghost" data-act="weak">Start my weakest '+weakN+'</button>';
  }else{
    h+='<p class="sub">This builds itself from your answers. Answer at least '+WEAK_MIN+' questions and it unlocks.</p>'+
      '<button class="btn ghost" disabled>Not enough answers yet</button>';
  }
  h+='</section>';
  h+='<footer class="foot"><button class="switch" data-act="shuffle" aria-pressed="'+!!prefs.shuffle+'"><i aria-hidden="true"></i><span>Mix up the question order</span></button>';
  if(askReset){
    h+='<p>Clear every score and start from zero?</p><div class="row"><button class="btn ghost" data-act="reset-yes">Yes, clear scores</button><button class="btn" data-act="reset-no">Keep them</button></div>';
  }else if(ans){
    h+='<button class="link" data-act="reset" style="align-self:flex-start">Reset my scores</button>';
  }
  h+='<p class="sub">Scores are saved on this device only.</p></footer>';
  app.innerHTML=h;
}

function renderQuiz(){
  var q=cur.q,t=topicById[q.t],n=sess?sess.ids.length:0,pos=cur.pos,L="ABCD";
  var h='<div class="bar"><button class="link" data-act="exit">Save and exit</button><span class="count">'+(pos+1)+' / '+n+'</span></div>'+
    '<div class="track"><div style="width:'+Math.round(100*(pos+(cur.done?1:0))/n)+'%"></div></div>'+
    '<article class="qcard" style="--t:var(--'+topicById[q.t].g+')">'+
    '<p class="tag"><span class="hl">'+esc(t.name)+'</span><span class="sec">'+esc(q.sec)+'</span></p>'+
    '<h2 class="q">'+esc(q.q)+'</h2>';
  if(q.type==="mc"){
    h+='<div class="opts">';
    cur.opts.forEach(function(o,i){
      var cls="opt";
      if(cur.picked!==null){
        if(o===q.a)cls+=" right";else if(i===cur.picked)cls+=" wrong";else cls+=" dim";
      }
      h+='<button class="'+cls+'" data-act="pick" data-i="'+i+'"'+(cur.picked!==null?' disabled':'')+'><b>'+L[i]+'</b><span>'+esc(o)+'</span></button>';
    });
    h+='</div>';
    if(cur.picked!==null){
      var ok=cur.opts[cur.picked]===q.a;
      h+='<p class="verdict '+(ok?'ok':'no')+'">'+(ok?'Correct.':'Not this time. The answer is '+esc(q.a)+'.')+'</p>';
      if(q.note)h+='<p class="note">'+esc(q.note)+'</p>';
      h+='<button class="btn" data-act="next" data-focus>'+(pos+1>=n?'Finish':'Next')+'</button>';
    }
  }else if(q.type==="ms"){
    var nSel=cur.sel.filter(Boolean).length;
    h+='<p class="hint">Select all that apply.</p><div class="opts">';
    cur.opts.forEach(function(o,i){
      var isC=q.p.indexOf(o)>-1,on=cur.sel[i],cls="opt",mark="",tag="";
      if(!cur.done){if(on){cls+=" sel";mark="\u2713";}}
      else if(isC&&on){cls+=" right";mark="\u2713";}
      else if(isC){cls+=" miss";mark="\u2713";tag='<em class="tagm">You missed this</em>';}
      else if(on){cls+=" wrong";mark="\u2715";tag='<em class="tagm">Does not apply</em>';}
      else cls+=" dim";
      h+='<button class="'+cls+'" data-act="msel" data-i="'+i+'" aria-pressed="'+!!on+'"'+(cur.done?' disabled':'')+'><b>'+mark+'</b><span>'+esc(o)+tag+'</span></button>';
    });
    h+='</div>';
    if(!cur.done){
      h+='<button class="btn" data-act="check"'+(nSel?'':' disabled')+'>Check</button>';
    }else{
      var hit=0,bad=0;
      cur.opts.forEach(function(o,i){if(cur.sel[i]){if(q.p.indexOf(o)>-1)hit++;else bad++;}});
      var all=hit===q.p.length&&!bad;
      h+='<p class="verdict '+(all?'ok':'no')+'">'+(all?'All correct.':'You got '+hit+' of '+q.p.length+(bad?', and picked '+bad+' that '+(bad===1?'does':'do')+' not apply':'')+'.')+'</p>';
      if(q.note)h+='<p class="note">'+esc(q.note)+'</p>';
      h+='<button class="btn" data-act="next" data-focus>'+(pos+1>=n?'Finish':'Next')+'</button>';
    }
  }else if(!cur.shown){
    h+='<p class="hint">'+(q.p.length>1?q.p.length+' points to recall. ':'')+'Say it out loud, then check.</p>'+
      '<button class="btn" data-act="show" data-focus>Show answer</button>';
  }else if(q.p.length===1){
    h+='<p class="answer">'+esc(q.p[0])+'</p>'+(q.note?'<p class="note">'+esc(q.note)+'</p>':'')+
      '<div class="row"><button class="btn" data-act="got" data-focus>Got it</button><button class="btn ghost" data-act="missed">Missed it</button></div>';
  }else{
    var got=cur.ticks.filter(Boolean).length;
    h+='<p class="hint">Tick the ones you got.</p><div class="points">';
    q.p.forEach(function(p,i){
      h+='<button class="opt'+(cur.ticks[i]?' on':'')+'" data-act="tick" data-i="'+i+'" aria-pressed="'+cur.ticks[i]+'"><b>'+(cur.ticks[i]?'✓':(i+1))+'</b><span>'+esc(p)+'</span></button>';
    });
    h+='</div>'+(q.note?'<p class="note">'+esc(q.note)+'</p>':'')+'<div class="row"><button class="btn" data-act="next" data-focus>'+(pos+1>=n?'Finish':'Next')+' ('+got+' of '+q.p.length+')</button>'+
      '<button class="btn ghost" data-act="gotall">Got them all</button></div>';
  }
  h+='</article>';
  app.innerHTML=h;
}

function renderDone(){
  var ids=last.ids,sum=0,missed=[];
  ids.forEach(function(id){var s=last.res[id]||0;sum+=s;if(s<1)missed.push(id);});
  var pct=Math.round(100*sum/ids.length),full=ids.length-missed.length;
  var h='<header class="block"><h1><span class="mark">'+esc(last.label)+', done</span></h1>'+
    '<p class="score">'+pct+'%</p>'+
    '<p class="sub">'+full+' of '+ids.length+' questions fully right.</p></header>';
  var seen=TOPICS.filter(function(t){return ids.some(function(id){return byId[id].t===t.id;});});
  if(seen.length>1){
    h+='<section class="block"><h2>By topic</h2><ul class="split">';
    seen.forEach(function(t){
      var l=ids.filter(function(id){return byId[id].t===t.id;}),s=0;
      l.forEach(function(id){s+=last.res[id]||0;});
      h+='<li style="--t:var(--'+t.g+')"><span>'+esc(t.name)+'</span><b>'+Math.round(100*s/l.length)+'%</b></li>';
    });
    h+='</ul></section>';
  }
  h+='<div class="row">';
  if(missed.length)h+='<button class="btn" data-act="retry" data-focus>Go again on the '+missed.length+' I missed</button>';
  h+='<button class="btn'+(missed.length?' ghost':'')+'" data-act="home"'+(missed.length?'':' data-focus')+'>Back to the start</button></div>';
  if(missed.length){
    h+='<section class="block"><h2>To go over</h2><ul class="missed">';
    missed.forEach(function(id){
      var q=byId[id];
      h+='<li style="--t:var(--'+topicById[q.t].g+')"><span class="mq">'+esc(q.q)+'</span><span class="ma">'+esc(q.type==="mc"?q.a:q.p.join("; "))+'</span></li>';
    });
    h+='</ul></section>';
  }
  app.innerHTML=h;
}

function render(){
  if(view==="quiz"&&cur)renderQuiz();
  else if(view==="done"&&last)renderDone();
  else{view="home";renderHome();}
  var f=app.querySelector("[data-focus]");
  if(f){try{f.focus({preventScroll:true});}catch(e){}}
}

function act(a,el){
  var i=el?parseInt(el.getAttribute("data-i"),10):-1;
  switch(a){
    case "all":start("Everything",order(Q.map(function(q){return q.id;})));break;
    case "topic":
      var id=el.getAttribute("data-id"),k=prefs.sel.indexOf(id);
      if(k>-1)prefs.sel.splice(k,1);else prefs.sel.push(id);
      save("pq.prefs",prefs);render();break;
    case "group":
      var gid=el.getAttribute("data-id"),gt=TOPICS.filter(function(t){return t.g===gid;}).map(function(t){return t.id;});
      var every=gt.every(function(x){return prefs.sel.indexOf(x)>-1;});
      prefs.sel=prefs.sel.filter(function(x){return gt.indexOf(x)<0;});
      if(!every)prefs.sel=prefs.sel.concat(gt);
      save("pq.prefs",prefs);render();break;
    case "topics":
      var names=TOPICS.filter(function(t){return prefs.sel.indexOf(t.id)>-1;}).map(function(t){return t.name;});
      start(names.length===1?names[0]:names.length+" topics",order(Q.filter(function(q){return prefs.sel.indexOf(q.t)>-1;}).map(function(q){return q.id;})));break;
    case "weak":start("Least well known",weakest());break;
    case "resume":nextQ();break;
    case "exit":view="home";cur=null;render();window.scrollTo(0,0);break;
    case "pick":
      if(cur.picked!==null)break;
      cur.picked=i;record(cur.opts[i]===cur.q.a?1:0);render();break;
    case "msel":if(cur.done)break;cur.sel[i]=!cur.sel[i];render();break;
    case "check":
      if(cur.done)break;
      var hit=0,bad=0;
      cur.opts.forEach(function(o,k){if(cur.sel[k]){if(cur.q.p.indexOf(o)>-1)hit++;else bad++;}});
      if(!hit&&!bad)break;
      record(Math.max(0,(hit-bad)/cur.q.p.length));render();break;
    case "show":cur.shown=true;render();break;
    case "got":record(1);nextQ();break;
    case "missed":record(0);nextQ();break;
    case "tick":cur.ticks[i]=!cur.ticks[i];render();break;
    case "gotall":record(1);nextQ();break;
    case "next":
      if(cur.q.type==="rc"&&!cur.done)record(cur.ticks.filter(Boolean).length/cur.q.p.length);
      nextQ();break;
    case "retry":
      start("Missed questions",last.ids.filter(function(id){return (last.res[id]||0)<1;}));break;
    case "home":view="home";last=null;render();window.scrollTo(0,0);break;
    case "shuffle":prefs.shuffle=!prefs.shuffle;save("pq.prefs",prefs);render();break;
    case "reset":askReset=true;render();break;
    case "reset-no":askReset=false;render();break;
    case "reset-yes":stats={};sess=null;askReset=false;drop("pq.stats");drop("pq.session");render();break;
  }
}

app.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el||el.disabled)return;
  act(el.getAttribute("data-act"),el);
});

document.addEventListener("keydown",function(e){
  if(view!=="quiz"||!cur||e.metaKey||e.ctrlKey||e.altKey)return;
  var k=e.key.toLowerCase(),n="1234567890".indexOf(k),l="abcd".indexOf(k);
  if(cur.q.type==="mc"&&cur.picked===null){
    var idx=l>-1?l:n;
    if(idx>-1&&idx<cur.opts.length){e.preventDefault();act("pick",app.querySelectorAll('[data-act="pick"]')[idx]);}
  }else if(cur.q.type==="ms"&&!cur.done&&n>-1&&n<cur.opts.length){
    e.preventDefault();act("msel",app.querySelectorAll('[data-act="msel"]')[n]);
  }else if(cur.q.type==="rc"&&cur.shown&&cur.q.p.length>1&&n>-1&&n<cur.q.p.length){
    e.preventDefault();act("tick",app.querySelectorAll('[data-act="tick"]')[n]);
  }
});

render();
})();
</script>
</body>
</html>
