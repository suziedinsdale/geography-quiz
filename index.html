<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Geography Case Study Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one narrow column, phone first. Home is a menu of three ways in; the quiz shows one question per screen.
   Each case study keeps the marker colour of its poster title, laid down like a highlighter stroke. */
:root{
  --paper:#F4F6FA; --card:#FFFFFF; --ink:#141824; --ink-2:#565D70; --line:#D9DDE7;
  --hl:#FFE95E;
  --good:#17703C; --good-bg:#D3F4D7; --bad:#B3243D; --bad-bg:#FFDCE2;
  --mex:#D3342C; --dha:#C96200; --ken:#1D6BC0; --abe:#7A4B2C; --hai:#7A3DA8; --tee:#0B857F; --oth:#4A5672;
  --display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --t:var(--ink);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12141B; --card:#1C1F2A; --ink:#EEF0F6; --ink-2:#A3A9BB; --line:#313545;
    --hl:#7A6C00;
    --good:#6FDB98; --good-bg:#173A26; --bad:#FF8A9B; --bad-bg:#47202A;
    --mex:#FF6F64; --dha:#FFA24D; --ken:#6DB2FF; --abe:#D6A784; --hai:#C797F2; --tee:#4FD1C8; --oth:#AEB8D0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12141B; --card:#1C1F2A; --ink:#EEF0F6; --ink-2:#A3A9BB; --line:#313545;
  --hl:#7A6C00;
  --good:#6FDB98; --good-bg:#173A26; --bad:#FF8A9B; --bad-bg:#47202A;
  --mex:#FF6F64; --dha:#FFA24D; --ken:#6DB2FF; --abe:#D6A784; --hai:#C797F2; --tee:#4FD1C8; --oth:#AEB8D0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:20px 40px}
#app{max-width:620px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;text-wrap:balance}
.mark{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 92%,transparent 92%);padding-inline:.12em}
.sub{color:var(--ink-2)}
.block{display:flex;flex-direction:column;gap:10px}
.block > .sub{font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ken);outline-offset:2px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:700;padding:14px 18px;border-radius:12px;text-align:center;width:100%}
.btn.ghost{background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 180px}
.link{background:none;border:0;padding:6px 0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.resume{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}

.topics{display:flex;flex-direction:column;gap:8px}
.topic{display:grid;grid-template-columns:26px 1fr auto;column-gap:12px;row-gap:8px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.topic[aria-pressed="true"]{border-color:var(--t)}
.swatch{width:26px;height:26px;border-radius:7px;border:2px solid var(--t);display:grid;place-items:center;color:var(--card);font-weight:700;font-size:16px;line-height:1}
.topic[aria-pressed="true"] .swatch{background:var(--t)}
.tname{font-weight:700;min-width:0}
.tmeta{display:block;font-weight:400;font-size:.85rem;color:var(--ink-2)}
.tpct{font-variant-numeric:tabular-nums;font-weight:700;color:var(--t)}
.meter{grid-column:1 / -1;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.meter > span{display:block;height:100%;background:var(--t);border-radius:4px}

.foot{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px;font-size:.95rem}
.switch{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;text-align:left}
.switch i{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--card)}
.switch[aria-pressed="true"] i{background:var(--ink)}
.switch[aria-pressed="true"] i::after{left:19px}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.count{font-variant-numeric:tabular-nums;font-weight:700}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track > div{height:100%;background:var(--ink)}
.qcard{display:flex;flex-direction:column;gap:16px}
.tag{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.tag .hl{background:color-mix(in srgb,var(--t) 24%,transparent);padding:3px 8px;border-radius:3px}
.tag .sec{color:var(--ink-2)}
.q{font-family:var(--display);font-weight:600;font-size:1.5rem;line-height:1.2;text-wrap:balance}
.opts,.points{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
.opt{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;width:100%}
.opt b{width:28px;height:28px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--ink-2)}
.opt span{min-width:0}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right b{border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong b{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.opt.on{background:var(--good-bg);border-color:var(--good)}
.opt.on b{background:var(--good);border-color:var(--good);color:var(--card)}
.verdict{font-weight:700}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--bad)}
.note{background:var(--card);border-left:5px solid var(--hl);padding:10px 12px;font-size:.95rem}
.answer{background:var(--card);border:2px solid var(--t);border-radius:12px;padding:14px;font-weight:700}
.hint{color:var(--ink-2);font-size:.95rem}

.score{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.split{display:flex;flex-direction:column;gap:6px;list-style:none;padding:0;margin:0}
.split li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-block:6px}
.split b{font-variant-numeric:tabular-nums;color:var(--t)}
.missed{display:flex;flex-direction:column;gap:10px;list-style:none;padding:0;margin:0}
.missed li{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--t);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.missed .mq{font-weight:700}
.missed .ma{color:var(--ink-2);font-size:.95rem}
@media (prefers-reduced-motion:no-preference){
  .track > div,.meter > span{transition:width .25s ease}
}
</style>
</head>

<main id="app"></main>

var byId={}, topicById={};
Q.forEach(function(q){byId[q.id]=q;});
TOPICS.forEach(function(t){topicById[t.id]=t;});
var WEAK_SIZE=20, WEAK_MIN=5;

function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function drop(k){try{localStorage.removeItem(k);}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}

var stats=load("gq.stats",{});
var prefs=load("gq.prefs",{shuffle:true,sel:[]});
if(!prefs||typeof prefs!=="object")prefs={shuffle:true,sel:[]};
if(!Array.isArray(prefs.sel))prefs.sel=[];
var sess=load("gq.session",null);
if(sess&&(!Array.isArray(sess.ids)||!sess.ids.every(function(id){return byId[id];})||sess.i>=sess.ids.length))sess=null;

var view="home", cur=null, last=null, askReset=false;
var app=document.getElementById("app");

function known(list){var s=0;list.forEach(function(q){if(stats[q.id])s+=stats[q.id].s;});return list.length?Math.round(100*s/list.length):0;}
function answered(list){return list.filter(function(q){return stats[q.id];}).length;}
function weakest(){
  var a=Q.filter(function(q){return stats[q.id];});
  a.sort(function(x,y){var sx=stats[x.id],sy=stats[y.id];return (sx.s-sy.s)||(sx.t-sy.t);});
  return a.slice(0,WEAK_SIZE).map(function(q){return q.id;});
}
function order(ids){return prefs.shuffle?shuffle(ids):ids;}

function start(label,ids){
  if(!ids.length)return;
  sess={label:label,ids:ids,i:0,res:{}};save("gq.session",sess);nextQ();
}
function nextQ(){
  if(!sess){view="home";render();return;}
  if(sess.i>=sess.ids.length){finish();return;}
  var q=byId[sess.ids[sess.i]];
  cur={q:q,pos:sess.i,done:false,
       opts:q.type==="mc"?shuffle([q.a].concat(q.d)):null,picked:null,
       shown:false,ticks:q.type==="rc"?q.p.map(function(){return false;}):null};
  view="quiz";render();window.scrollTo(0,0);
}
function record(score){
  var id=cur.q.id,st=stats[id]||{n:0,s:0};
  st.s=st.n?(st.s+score)/2:score;st.n+=1;st.t=Date.now();
  stats[id]=st;save("gq.stats",stats);
  sess.res[id]=score;sess.i=cur.pos+1;save("gq.session",sess);cur.done=true;
}
function finish(){last=sess;sess=null;drop("gq.session");view="done";render();window.scrollTo(0,0);}

function renderHome(){
  var total=Q.length,ans=answered(Q),weakN=Math.min(WEAK_SIZE,ans);
  var selIds=Q.filter(function(q){return prefs.sel.indexOf(q.t)>-1;}).map(function(q){return q.id;});
  var h='<header class="block"><h1><span class="mark">Case study quiz</span></h1>'+
    '<p class="sub">'+total+' questions from your posters. '+ans+' answered so far, '+known(Q)+'% known.</p></header>';
  if(sess){
    h+='<section class="resume"><h2>'+esc(sess.label)+', in progress</h2>'+
      '<p class="sub">You’re on question '+(sess.i+1)+' of '+sess.ids.length+'.</p>'+
      '<button class="btn" data-act="resume">Carry on</button></section>';
  }
  h+='<section class="block"><h2>Everything</h2>'+
    '<p class="sub">Every point on the six full posters, plus what could be read of three more. Stop whenever you like and it keeps your place.</p>'+
    '<button class="btn'+(sess?' ghost':'')+'" data-act="all">Start all '+total+' questions</button></section>';
  h+='<section class="block"><h2>By case study</h2><p class="sub">Tick one or more. The bar shows how much of each you know.</p><div class="topics">';
  TOPICS.forEach(function(t){
    var list=Q.filter(function(q){return q.t===t.id;}),on=prefs.sel.indexOf(t.id)>-1,k=known(list);
    h+='<button class="topic" data-act="topic" data-id="'+t.id+'" aria-pressed="'+on+'" style="--t:var(--'+t.id+')">'+
      '<span class="swatch" aria-hidden="true">'+(on?'✓':'')+'</span>'+
      '<span class="tname">'+esc(t.name)+'<span class="tmeta">'+list.length+' questions, '+answered(list)+' answered</span></span>'+
      '<span class="tpct">'+k+'%</span>'+
      '<span class="meter"><span style="width:'+k+'%"></span></span></button>';
  });
  h+='</div><button class="btn ghost" data-act="topics"'+(selIds.length?'':' disabled')+'>'+
    (selIds.length?'Start '+selIds.length+' questions':'Pick a case study')+'</button></section>';
  h+='<section class="block"><h2>Least well known</h2>';
  if(ans>=WEAK_MIN){
    h+='<p class="sub">Your '+weakN+' lowest scoring questions, worked out from your answers. It updates every time you answer.</p>'+
      '<button class="btn ghost" data-act="weak">Start my weakest '+weakN+'</button>';
  }else{
    h+='<p class="sub">This builds itself from your answers. Answer at least '+WEAK_MIN+' questions and it unlocks.</p>'+
      '<button class="btn ghost" disabled>Not enough answers yet</button>';
  }
  h+='</section>';
  h+='<footer class="foot"><button class="switch" data-act="shuffle" aria-pressed="'+!!prefs.shuffle+'"><i aria-hidden="true"></i><span>Mix up the question order</span></button>';
  if(askReset){
    h+='<p>Clear every score and start from zero?</p><div class="row"><button class="btn ghost" data-act="reset-yes">Yes, clear scores</button><button class="btn" data-act="reset-no">Keep them</button></div>';
  }else if(ans){
    h+='<button class="link" data-act="reset" style="align-self:flex-start">Reset my scores</button>';
  }
  h+='<p class="sub">Scores are saved on this device only.</p></footer>';
  app.innerHTML=h;
}

function renderQuiz(){
  var q=cur.q,t=topicById[q.t],n=sess?sess.ids.length:0,pos=cur.pos,L="ABCD";
  var h='<div class="bar"><button class="link" data-act="exit">Save and exit</button><span class="count">'+(pos+1)+' / '+n+'</span></div>'+
    '<div class="track"><div style="width:'+Math.round(100*(pos+(cur.done?1:0))/n)+'%"></div></div>'+
    '<article class="qcard" style="--t:var(--'+q.t+')">'+
    '<p class="tag"><span class="hl">'+esc(t.name)+'</span><span class="sec">'+esc(q.sec)+'</span></p>'+
    '<h2 class="q">'+esc(q.q)+'</h2>';
  if(q.type==="mc"){
    h+='<div class="opts">';
    cur.opts.forEach(function(o,i){
      var cls="opt";
      if(cur.picked!==null){
        if(o===q.a)cls+=" right";else if(i===cur.picked)cls+=" wrong";else cls+=" dim";
      }
      h+='<button class="'+cls+'" data-act="pick" data-i="'+i+'"'+(cur.picked!==null?' disabled':'')+'><b>'+L[i]+'</b><span>'+esc(o)+'</span></button>';
    });
    h+='</div>';
    if(cur.picked!==null){
      var ok=cur.opts[cur.picked]===q.a;
      h+='<p class="verdict '+(ok?'ok':'no')+'">'+(ok?'Correct.':'Not this time. The answer is '+esc(q.a)+'.')+'</p>';
      if(q.note)h+='<p class="note">'+esc(q.note)+'</p>';
      h+='<button class="btn" data-act="next" data-focus>'+(pos+1>=n?'Finish':'Next')+'</button>';
    }
  }else if(!cur.shown){
    h+='<p class="hint">'+(q.p.length>1?q.p.length+' points to recall. ':'')+'Say it out loud, then check.</p>'+
      '<button class="btn" data-act="show" data-focus>Show answer</button>';
  }else if(q.p.length===1){
    h+='<p class="answer">'+esc(q.p[0])+'</p>'+(q.note?'<p class="note">'+esc(q.note)+'</p>':'')+
      '<div class="row"><button class="btn" data-act="got" data-focus>Got it</button><button class="btn ghost" data-act="missed">Missed it</button></div>';
  }else{
    var got=cur.ticks.filter(Boolean).length;
    h+='<p class="hint">Tick the ones you got.</p><div class="points">';
    q.p.forEach(function(p,i){
      h+='<button class="opt'+(cur.ticks[i]?' on':'')+'" data-act="tick" data-i="'+i+'" aria-pressed="'+cur.ticks[i]+'"><b>'+(cur.ticks[i]?'✓':(i+1))+'</b><span>'+esc(p)+'</span></button>';
    });
    h+='</div>'+(q.note?'<p class="note">'+esc(q.note)+'</p>':'')+'<div class="row"><button class="btn" data-act="next" data-focus>'+(pos+1>=n?'Finish':'Next')+' ('+got+' of '+q.p.length+')</button>'+
      '<button class="btn ghost" data-act="gotall">Got them all</button></div>';
  }
  h+='</article>';
  app.innerHTML=h;
}

function renderDone(){
  var ids=last.ids,sum=0,missed=[];
  ids.forEach(function(id){var s=last.res[id]||0;sum+=s;if(s<1)missed.push(id);});
  var pct=Math.round(100*sum/ids.length),full=ids.length-missed.length;
  var h='<header class="block"><h1><span class="mark">'+esc(last.label)+', done</span></h1>'+
    '<p class="score">'+pct+'%</p>'+
    '<p class="sub">'+full+' of '+ids.length+' questions fully right.</p></header>';
  var seen=TOPICS.filter(function(t){return ids.some(function(id){return byId[id].t===t.id;});});
  if(seen.length>1){
    h+='<section class="block"><h2>By case study</h2><ul class="split">';
    seen.forEach(function(t){
      var l=ids.filter(function(id){return byId[id].t===t.id;}),s=0;
      l.forEach(function(id){s+=last.res[id]||0;});
      h+='<li style="--t:var(--'+t.id+')"><span>'+esc(t.name)+'</span><b>'+Math.round(100*s/l.length)+'%</b></li>';
    });
    h+='</ul></section>';
  }
  h+='<div class="row">';
  if(missed.length)h+='<button class="btn" data-act="retry" data-focus>Go again on the '+missed.length+' I missed</button>';
  h+='<button class="btn'+(missed.length?' ghost':'')+'" data-act="home"'+(missed.length?'':' data-focus')+'>Back to the start</button></div>';
  if(missed.length){
    h+='<section class="block"><h2>To go over</h2><ul class="missed">';
    missed.forEach(function(id){
      var q=byId[id];
      h+='<li style="--t:var(--'+q.t+')"><span class="mq">'+esc(q.q)+'</span><span class="ma">'+esc(q.type==="mc"?q.a:q.p.join("; "))+'</span></li>';
    });
    h+='</ul></section>';
  }
  app.innerHTML=h;
}

function render(){
  if(view==="quiz"&&cur)renderQuiz();
  else if(view==="done"&&last)renderDone();
  else{view="home";renderHome();}
  var f=app.querySelector("[data-focus]");
  if(f){try{f.focus({preventScroll:true});}catch(e){}}
}

function act(a,el){
  var i=el?parseInt(el.getAttribute("data-i"),10):-1;
  switch(a){
    case "all":start("Everything",order(Q.map(function(q){return q.id;})));break;
    case "topic":
      var id=el.getAttribute("data-id"),k=prefs.sel.indexOf(id);
      if(k>-1)prefs.sel.splice(k,1);else prefs.sel.push(id);
      save("gq.prefs",prefs);render();break;
    case "topics":
      var names=TOPICS.filter(function(t){return prefs.sel.indexOf(t.id)>-1;}).map(function(t){return t.name;});
      start(names.length===1?names[0]:names.length+" case studies",order(Q.filter(function(q){return prefs.sel.indexOf(q.t)>-1;}).map(function(q){return q.id;})));break;
    case "weak":start("Least well known",weakest());break;
    case "resume":nextQ();break;
    case "exit":view="home";cur=null;render();window.scrollTo(0,0);break;
    case "pick":
      if(cur.picked!==null)break;
      cur.picked=i;record(cur.opts[i]===cur.q.a?1:0);render();break;
    case "show":cur.shown=true;render();break;
    case "got":record(1);nextQ();break;
    case "missed":record(0);nextQ();break;
    case "tick":cur.ticks[i]=!cur.ticks[i];render();break;
    case "gotall":record(1);nextQ();break;
    case "next":
      if(cur.q.type==="rc"&&!cur.done)record(cur.ticks.filter(Boolean).length/cur.q.p.length);
      nextQ();break;
    case "retry":
      start("Missed questions",last.ids.filter(function(id){return (last.res[id]||0)<1;}));break;
    case "home":view="home";last=null;render();window.scrollTo(0,0);break;
    case "shuffle":prefs.shuffle=!prefs.shuffle;save("gq.prefs",prefs);render();break;
    case "reset":askReset=true;render();break;
    case "reset-no":askReset=false;render();break;
    case "reset-yes":stats={};sess=null;askReset=false;drop("gq.stats");drop("gq.session");render();break;
  }
}

app.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el||el.disabled)return;
  act(el.getAttribute("data-act"),el);
});

document.addEventListener("keydown",function(e){
  if(view!=="quiz"||!cur||e.metaKey||e.ctrlKey||e.altKey)return;
  var k=e.key.toLowerCase(),n="1234567890".indexOf(k),l="abcd".indexOf(k);
  if(cur.q.type==="mc"&&cur.picked===null){
    var idx=l>-1?l:n;
    if(idx>-1&&idx<cur.opts.length){e.preventDefault();act("pick",app.querySelectorAll('[data-act="pick"]')[idx]);}
  }else if(cur.q.type==="rc"&&cur.shown&&cur.q.p.length>1&&n>-1&&n<cur.q.p.length){
    e.preventDefault();act("tick",app.querySelectorAll('[data-act="tick"]')[n]);
  }
});

render();
})();
</script>
